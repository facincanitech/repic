name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --release

      - name: Compilar
        run: cargo build --release

      - name: Baixar FFmpeg (build essentials do gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          $bin = Get-ChildItem -Path ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist/RePic | Out-Null
          Copy-Item $bin.FullName dist/RePic/
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") dist/RePic/

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item target/release/RePic.exe dist/RePic/
          Copy-Item dist-files/LEIA-ME.txt dist/RePic/
          Compress-Archive -Path dist/RePic -DestinationPath RePic-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RePic-windows
          path: RePic-windows.zip

      - name: Publicar release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RePic-windows.zip
          generate_release_notes: true
