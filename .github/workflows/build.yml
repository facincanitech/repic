name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --release

      - name: Compilar
        run: cargo build --release

      - name: Baixar FFmpeg (build essentials do gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          $bin = Get-ChildItem -Path ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bin.FullName dist/ffmpeg.exe

      - name: Instalar Inno Setup 6.7.3 (versão fixa, a mesma testada)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile is.exe
          Start-Process .\is.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/PORTABLE=1','/NOICONS',"/DIR=$PWD\inno" -Wait
          if (-not (Test-Path .\inno\ISCC.exe)) { throw "Inno Setup não instalou" }

      - name: Montar instalador
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & .\inno\ISCC.exe /Q "/DMyAppVersion=$version" installer\repic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\RePic-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RePic-Setup
          path: dist/RePic-Setup.exe

      - name: Publicar release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RePic-Setup.exe
          generate_release_notes: true
