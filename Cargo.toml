[package]
name = "repic"
version = "0.3.0"
edition = "2024"
description = "Clipador leve: aperta F8 e salva os ultimos segundos da tela"

[[bin]]
name = "RePic"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = { version = "0.18.2", default-features = false }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
hound = { version = "3.5.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
rfd = { version = "0.17.2", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Só pra compilar/testar no Linux; o alvo real é Windows.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11"] }
