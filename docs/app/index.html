<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RePic</title>
<style>
  :root {
    --bg: #111115; --card: #1b1b21; --card-2: #25252d; --line: #2c2c35;
    --text: #f2f2f5; --muted: #9a9aa6; --accent: #eb4040; --ok: #6ec878;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #666; }
  .dot.on { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  button { font: inherit; color: #fff; background: var(--card-2); border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
  button:disabled { opacity: .45; }
  button.primary { background: var(--accent); }
  .actions small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
  button.icon { min-width: 44px; padding: 0 12px; font-size: 18px; }
  #status { padding: 0 16px; color: var(--muted); font-size: 13px; min-height: 19px; }
  #message { padding: 2px 16px 0; color: var(--ok); font-size: 13px; min-height: 19px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 16px 14px; }
  .actions .wide { grid-column: 1 / -1; }
  #update { margin: 0 16px 12px; padding: 10px 12px; background: var(--card); border: 1px solid var(--accent); border-radius: 10px; display: none; align-items: center; gap: 10px; }
  #update span { flex: 1; font-size: 13px; }
  #update a { color: #fff; background: var(--accent); padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; }
  h2 { font-size: 16px; margin: 4px 16px 10px; }
  h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  #clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 0 12px 24px; }
  .clip { background: var(--card); border-radius: 10px; overflow: hidden; min-width: 0; }
  .thumb { aspect-ratio: 3/4; min-height: 0; background: #26262c; position: relative; width: 100%; padding: 0; border-radius: 0; display: block; overflow: hidden; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span { position: absolute; right: 4px; bottom: 4px; font-size: 10px; font-weight: 500; background: rgba(0,0,0,.7); padding: 1px 4px; border-radius: 4px; }
  .info { padding: 5px 6px 6px; }
  .info b { display: block; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info small { display: block; color: var(--muted); font-size: 10px; margin-bottom: 4px; }
  .clip .row { gap: 4px; }
  .clip .row button { min-height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .clip .row svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .row button { font-size: 13px; padding: 6px; min-height: 38px; }
  .danger { color: var(--accent); }
  #empty { color: var(--muted); text-align: center; padding: 36px 24px; display: none; }
  dialog { background: #18181e; color: var(--text); border: 1px solid var(--line); border-radius: 14px; width: min(94vw, 460px); max-height: 88vh; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h3 { margin: 0 0 12px; font-size: 19px; }
  fieldset { border: 0; background: var(--card); border-radius: 10px; margin: 0 0 12px; padding: 10px 12px; }
  legend { color: var(--accent); font-weight: 600; font-size: 13px; float: left; width: 100%; padding: 0 0 8px; }
  label.line { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; clear: both; }
  .pair { display: flex; gap: 6px; }
  input[type=number], select { font: inherit; color: var(--text); background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 40px; }
  input[type=number] { width: 84px; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 2px 0 8px; clear: both; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin: 4px 0 12px; }
  .foot a { color: var(--text); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><h1>RePic</h1>
  <button class="icon" id="openSettings" aria-label="Settings">⚙</button>
</header>
<div id="status"></div>
<div id="message"></div>
<div class="actions">
  <button class="primary wide" id="power"></button>
  <button id="clip" disabled></button>
  <button id="record" disabled></button>
</div>
<div id="update"><span id="updateText"></span><a id="updateLink" href="#"></a></div>
<h2><span data-t="recent"></span><small id="count"></small></h2>
<div id="empty" data-t="empty"></div>
<div id="clips"></div>

<dialog id="settings">
  <h3 data-t="settings"></h3>
  <fieldset><legend data-t="sec_recording"></legend>
    <label class="line"><span data-t="duration"></span>
      <span class="pair"><input type="number" id="durValue" min="1" inputmode="numeric"><select id="durUnit"></select></span></label>
    <div class="hint" data-t="duration_hint"></div>
    <label class="line">FPS<select id="fps"></select></label>
    <label class="line"><span data-t="resolution"></span><select id="resolution"></select></label>
    <label class="line"><span data-t="quality"></span><select id="quality"></select></label>
    <label class="line"><span data-t="limit"></span>
      <span class="pair"><input type="number" id="limitValue" min="0" inputmode="numeric"><select id="limitUnit"><option value="1">MB</option><option value="1000">GB</option></select></span></label>
    <div class="hint" data-t="limit_hint"></div>
  </fieldset>
  <fieldset><legend data-t="sec_audio"></legend>
    <label class="line"><span data-t="audio"></span><input type="checkbox" id="audio"></label>
    <label class="line"><span data-t="mic"></span><input type="checkbox" id="mic"></label>
    <div class="hint" data-t="audio_hint"></div>
  </fieldset>
  <p class="foot"><span id="version"></span> · powered by <a href="https://facincanitech.github.io" target="_blank" rel="noopener">FacincaniTech</a></p>
  <button id="closeSettings" class="primary" style="width:100%" data-t="close"></button>
</dialog>

<dialog id="confirm">
  <p id="confirmText"></p>
  <div class="row"><button id="confirmNo" data-t="cancel"></button><button id="confirmYes" class="danger" data-t="delete"></button></div>
</dialog>

<script>
const T = {
  pt: {
    start: "Iniciar", stop_all: "Encerrar", clip: "RePic", clip_hint: "salva o que já passou", record: "Gravar", record_hint: "daqui pra frente", stop: "Parar", saving: "Salvando…",
    recent: "Últimos clipes", empty: "Aperte Iniciar e toque na bolinha: RePic salva o que já passou, Gravar grava daqui pra frente.",
    settings: "Configurações", sec_recording: "Gravação", duration: "Duração do clipe", duration_hint: "De 15 segundos até 2 horas. Quanto maior, mais espaço ocupa o tempo todo.",
    units: ["segundos", "minutos", "horas"], resolution: "Resolução", native_res: "Nativa (recomendado)", native_fps: "Nativo (recomendado)", quality: "Qualidade",
    qualities: ["Leve", "Normal", "Alta (recomendado)", "Máxima"], limit: "Limite da gravação", limit_hint: "A gravação para e salva sozinha um pouco antes desse tamanho. Vazio: sem limite.",
    sec_audio: "Áudio", audio: "Som do aparelho", mic: "Microfone", audio_hint: "Alguns apps e jogos não permitem gravar o som deles.",
    close: "Fechar", cancel: "Cancelar", delete: "Excluir", share: "Compartilhar", confirm_delete: "Excluir {}? Não dá pra desfazer.", looping: "Gravando em loop · {} · últimos {}", off: "Aperte Iniciar e a bolinha aparece por cima dos outros apps. Dá pra arrastar.", need_overlay: "Pra bolinha aparecer, o Android precisa da permissão de sobrepor outros apps.",
    recording: "Gravando · {} · {}", update: "Versão nova do app: {}", download: "Baixar", browser: "Abra pelo app do RePic no Android."
  },
  en: {
    start: "Start", stop_all: "End", clip: "RePic", clip_hint: "saves what already happened", record: "Record", record_hint: "from now on", stop: "Stop", saving: "Saving…",
    recent: "Recent clips", empty: "Press Start and tap the bubble: RePic saves what already happened, Record records from now on.",
    settings: "Settings", sec_recording: "Recording", duration: "Clip length", duration_hint: "From 15 seconds to 2 hours. Longer lengths use more storage all the time.",
    units: ["seconds", "minutes", "hours"], resolution: "Resolution", native_res: "Native (recommended)", native_fps: "Native (recommended)", quality: "Quality",
    qualities: ["Light", "Normal", "High (recommended)", "Maximum"], limit: "Recording limit", limit_hint: "Recording stops and saves by itself just before this size. Empty: no limit.",
    sec_audio: "Audio", audio: "Device sound", mic: "Microphone", audio_hint: "Some apps and games don't allow their sound to be recorded.",
    close: "Close", cancel: "Cancel", delete: "Delete", share: "Share", confirm_delete: "Delete {}? This can't be undone.", looping: "Recording in a loop · {} · last {}", off: "Press Start and the bubble shows up over your other apps. You can drag it.", need_overlay: "For the bubble to show up, Android needs the permission to display over other apps.",
    recording: "Recording · {} · {}", update: "New app version: {}", download: "Download", browser: "Open this from the RePic app on Android."
  },
  es: {
    start: "Iniciar", stop_all: "Terminar", clip: "RePic", clip_hint: "guarda lo que ya pasó", record: "Grabar", record_hint: "de ahora en adelante", stop: "Parar", saving: "Guardando…",
    recent: "Clips recientes", empty: "Pulsa Iniciar y toca la burbuja: RePic guarda lo que ya pasó, Grabar graba de ahora en adelante.",
    settings: "Configuración", sec_recording: "Grabación", duration: "Duración del clip", duration_hint: "De 15 segundos hasta 2 horas. Cuanto más largo, más espacio ocupa todo el tiempo.",
    units: ["segundos", "minutos", "horas"], resolution: "Resolución", native_res: "Nativa (recomendado)", native_fps: "Nativo (recomendado)", quality: "Calidad",
    qualities: ["Ligera", "Normal", "Alta (recomendado)", "Máxima"], limit: "Límite de grabación", limit_hint: "La grabación para y se guarda sola un poco antes de este tamaño. Vacío: sin límite.",
    sec_audio: "Audio", audio: "Sonido del dispositivo", mic: "Micrófono", audio_hint: "Algunas apps y juegos no permiten grabar su sonido.",
    close: "Cerrar", cancel: "Cancelar", delete: "Eliminar", share: "Compartir", confirm_delete: "¿Eliminar {}? No se puede deshacer.", looping: "Grabando en bucle · {} · últimos {}", off: "Pulsa Iniciar y la burbuja aparece sobre las otras apps. Puedes arrastrarla.", need_overlay: "Para que aparezca la burbuja, Android necesita el permiso de mostrarse sobre otras apps.",
    recording: "Grabando · {} · {}", update: "Versión nueva de la app: {}", download: "Descargar", browser: "Abre esto desde la app RePic en Android."
  }
};
const lang = (navigator.language || "en").slice(0, 2).toLowerCase();
const t = T[lang] || T.en;
const fill = (text, ...args) => args.reduce((s, a) => s.replace("{}", a), text);
const $ = id => document.getElementById(id);
const native = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RePic;

document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t[e.dataset.t]; });
const label = (button, title, hint) => {
  button.textContent = title;
  if (hint) { const small = document.createElement("small"); small.textContent = hint; button.append(small); }
};
label($("clip"), t.clip, t.clip_hint);
$("durUnit").innerHTML = [1, 60, 3600].map((u, i) => `<option value="${u}">${t.units[i]}</option>`).join("");
$("quality").innerHTML = t.qualities.map((q, i) => `<option value="${i}">${q}</option>`).join("");
$("fps").innerHTML = `<option value="0">${t.native_fps}</option>` + [120, 90, 60, 30].map(f => `<option value="${f}">${f} fps</option>`).join("");
$("resolution").innerHTML = `<option value="0">${t.native_res}</option>` + [1440, 1080, 720, 480].map(r => `<option value="${r}">${r}p</option>`).join("");

const formatDuration = s => {
  if (s < 120) return s + "s";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return [h && h + "h", m && m + "min", r && r + "s"].filter(Boolean).join(" ");
};
const formatSize = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b < 1e7 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e6) + " MB";
const clock = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const bestUnit = s => s >= 3600 && s % 3600 === 0 ? 3600 : s >= 60 && s % 60 === 0 ? 60 : 1;

let config = null, lastMessage = "", clipCount = -1, waitingOverlay = false, wasSaving = false;

async function refreshState() {
  if (!native) return;
  const s = await native.getState();
  $("dot").classList.toggle("on", s.running);
  $("power").textContent = s.running ? t.stop_all : t.start;
  $("power").classList.toggle("primary", !s.running);
  $("clip").style.display = $("record").style.display = s.running ? "" : "none";
  $("clip").disabled = !s.running || s.saving;
  $("record").disabled = !s.running || (s.saving && !s.recording);
  label($("record"), s.saving && !s.recording ? t.saving : s.recording ? t.stop : t.record, s.saving || s.recording ? "" : t.record_hint);
  $("record").classList.toggle("primary", s.recording);
  const limit = config && config.limitMb ? " / " + formatSize(config.limitMb * 1e6) : "";
  $("status").textContent = !s.running ? t.off
    : s.recording ? fill(t.recording, clock(s.recordingSeconds), formatSize(s.recordingBytes) + limit)
    : fill(t.looping, s.videoSize.replace("x", "×"), config ? formatDuration(config.seconds) : "");
  // Dois clipes seguidos repetem a mensagem: o fim do salvamento também atualiza a lista.
  if (s.message !== lastMessage || (wasSaving && !s.saving)) {
    lastMessage = s.message;
    $("message").textContent = s.message;
    refreshClips();
  }
  wasSaving = s.saving;
  $("version").textContent = "RePic v" + s.nativeVersion;
  window.nativeVersion = s.nativeVersion;
}

const ICON_SHARE = '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 14v6h14v-6"/></svg>';
const ICON_DELETE = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';

async function refreshClips() {
  if (!native) return;
  const { clips } = await native.listClips();
  const list = Array.isArray(clips) ? clips : [];
  $("count").textContent = list.length;
  $("empty").style.display = list.length ? "none" : "block";
  if (list.length === clipCount) return;
  clipCount = list.length;
  const box = $("clips");
  box.textContent = "";
  for (const clip of list) {
    const card = document.createElement("div");
    card.className = "clip";
    const thumb = document.createElement("button");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    const badge = document.createElement("span");
    badge.textContent = formatDuration(Math.round(clip.duration / 1000));
    thumb.append(img, badge);
    thumb.onclick = () => native.openClip({ id: clip.id });
    native.thumbnail({ id: clip.id }).then(r => { img.src = r.image; }).catch(() => {});
    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("b");
    name.textContent = new Date(clip.date * 1000).toLocaleString(undefined, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const when = document.createElement("small");
    when.textContent = formatSize(clip.size);
    const row = document.createElement("div");
    row.className = "row";
    const share = document.createElement("button");
    share.innerHTML = ICON_SHARE;
    share.setAttribute("aria-label", t.share);
    share.onclick = () => native.shareClip({ id: clip.id });
    const del = document.createElement("button");
    del.innerHTML = ICON_DELETE;
    del.setAttribute("aria-label", t.delete);
    del.className = "danger";
    del.onclick = () => askDelete(clip);
    row.append(share, del);
    info.append(name, when, row);
    card.append(thumb, info);
    box.append(card);
  }
}

function askDelete(clip) {
  $("confirmText").textContent = fill(t.confirm_delete, clip.name);
  $("confirmYes").onclick = async () => {
    $("confirm").close();
    await native.deleteClip({ id: clip.id }).catch(() => {});
    clipCount = -1;
    refreshClips();
  };
  $("confirm").showModal();
}

function showConfig() {
  const unit = bestUnit(config.seconds);
  $("durUnit").value = unit;
  $("durValue").value = config.seconds / unit;
  $("fps").value = config.fps;
  $("resolution").value = config.resolution;
  $("quality").value = config.quality;
  const limitUnit = config.limitMb && config.limitMb % 1000 === 0 ? 1000 : 1;
  $("limitUnit").value = limitUnit;
  $("limitValue").value = config.limitMb ? config.limitMb / limitUnit : "";
  $("audio").checked = config.audio;
  $("mic").checked = config.mic;
}

async function saveConfig() {
  const unit = +$("durUnit").value;
  const typed = Math.max(1, parseInt($("durValue").value, 10) || 1);
  const seconds = Math.min(7200, Math.max(15, typed * unit));
  const limit = parseInt($("limitValue").value, 10) || 0;
  config = {
    seconds,
    fps: +$("fps").value,
    resolution: +$("resolution").value,
    quality: +$("quality").value,
    limitMb: limit * +$("limitUnit").value,
    audio: $("audio").checked,
    mic: $("mic").checked,
  };
  await native.setConfig(config);
  config = await native.getConfig();
  showConfig();
}

/** Avisa quando existe APK mais novo: a interface atualiza sozinha, a captura não. */
async function checkNativeUpdate() {
  try {
    const info = await (await fetch("apk.json", { cache: "no-store" })).json();
    const newer = (a, b) => {
      const x = a.split(".").map(Number), y = b.split(".").map(Number);
      for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
      return false;
    };
    if (window.nativeVersion && newer(info.version, window.nativeVersion)) {
      $("updateText").textContent = fill(t.update, info.version);
      $("updateLink").textContent = t.download;
      $("updateLink").href = info.url;
      $("update").style.display = "flex";
    }
  } catch (_) { /* Sem internet: tenta na próxima vez. */ }
}

/** Voltou da tela de permissão: com ela liberada, segue direto pro Iniciar. */
async function returnFromOverlay() {
  waitingOverlay = false;
  const s = await native.getState();
  if (s.canOverlay) { await native.startCapture().catch(() => {}); refreshState(); }
  else $("message").textContent = t.need_overlay;
}

async function main() {
  if (!native) {
    $("status").textContent = t.browser;
    document.querySelector(".actions").style.display = "none";
    $("openSettings").style.display = "none";
    return;
  }
  config = await native.getConfig();
  showConfig();
  $("power").onclick = async () => {
    const s = await native.getState();
    if (s.running) await native.stopCapture();
    else if (s.canOverlay) await native.startCapture().catch(() => {});
    else { waitingOverlay = true; await native.requestOverlay(); }
    refreshState();
  };
  $("clip").onclick = () => native.clip();
  $("record").onclick = () => native.toggleRecording();
  $("openSettings").onclick = () => { showConfig(); $("settings").showModal(); };
  $("closeSettings").onclick = () => $("settings").close();
  $("settings").querySelectorAll("input,select").forEach(e => { e.onchange = saveConfig; });
  await refreshState();
  await refreshClips();
  await checkNativeUpdate();
  setInterval(refreshState, 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    clipCount = -1; refreshState(); refreshClips();
    if (waitingOverlay) returnFromOverlay();
  });
}
main();
</script>
</body>
</html>
